name: ML Delivery

on:
  push:
    branches:
      - main
      - staging
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Choose lowercase image name
        id: image
        shell: bash
        run: |
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "name=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish multi-platform image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./iris - docker
          file: ./iris - docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

  load_test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Locust
        run: python -m pip install "locust>=2.32,<3"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull tested image digest
        env:
          IMAGE_REF: ${{ needs.build.outputs.image_ref }}
        run: docker pull "$IMAGE_REF"

      - name: Start staging container
        env:
          IMAGE_REF: ${{ needs.build.outputs.image_ref }}
        run: docker run --detach --name iris-staging --publish 127.0.0.1:5000:5000 "$IMAGE_REF"

      - name: Run smoke checks
        run: python scripts/smoke.py http://127.0.0.1:5000

      - name: Run headless load test
        run: |
          mkdir -p reports
          locust -f locustfile.py \
            --headless \
            --host http://127.0.0.1:5000 \
            --users 20 \
            --spawn-rate 5 \
            --run-time 60s \
            --stop-timeout 5 \
            --csv reports/staging \
            --html reports/staging.html

      - name: Upload load-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-reports-${{ github.sha }}
          path: reports/
          if-no-files-found: warn

      - name: Show staging container logs
        if: always()
        run: docker logs iris-staging

      - name: Remove staging container
        if: always()
        run: |
          if [ -n "$(docker ps -aq --filter 'name=^iris-staging$')" ]; then
            docker rm --force iris-staging
          fi

  release:
    needs:
      - build
      - load_test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Prepare approved release bundle
        env:
          IMAGE_REF: ${{ needs.build.outputs.image_ref }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          mkdir release
          cp compose.yaml release/compose.yaml
          cp scripts/smoke.py release/smoke.py
          printf 'IMAGE_REF=%s\nHOST_PORT=5000\n' "$IMAGE_REF" > release/release.env
          printf '%s\n' "$SOURCE_SHA" > release/source-commit.txt

      - name: Upload approved release bundle
        uses: actions/upload-artifact@v4
        with:
          name: approved-release-${{ github.sha }}
          path: release/
          if-no-files-found: error
